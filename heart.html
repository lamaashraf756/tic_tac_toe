<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>أنيميشن قلب نابض</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #1a1a1a;
        }

        .heart-container {
            position: relative;
        }

        .heart {
            position: relative;
            width: 100px;
            height: 100px;
            background-color: #ff3838;
            transform: rotate(-45deg);
            box-shadow: 0 0 40px #ff3838;
            animation: beat 1.2s infinite ease-in-out;
        }

        .heart::before {
            content: "";
            position: absolute;
            width: 100px;
            height: 100px;
            background-color: #ff3838;
            border-radius: 50%;
            top: -50px;
            left: 0;
        }

        .heart::after {
            content: "";
            position: absolute;
            width: 100px;
            height: 100px;
            background-color: #ff3838;
            border-radius: 50%;
            top: 0;
            left: 50px;
        }

        @keyframes beat {
            0% { transform: rotate(-45deg) scale(1); }
            20% { transform: rotate(-45deg) scale(1.25); }
            40% { transform: rotate(-45deg) scale(1.1); }
            60% { transform: rotate(-45deg) scale(1.35); }
            100% { transform: rotate(-45deg) scale(1); }
        }
    </style>
</head>
<body>

    <div class="heart-container">
        <div class="heart"></div>
    </div>

</body>
</html>
